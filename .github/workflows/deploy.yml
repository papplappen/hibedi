# Builds the wasm client and publishes the page (web/) to GitHub Pages.
#
# Pages must be enabled once in the repository settings, with
# "GitHub Actions" as the source (Settings → Pages → Build and
# deployment). Until then the deploy job fails; the build still runs.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push supersedes a queued one, but a
# running deployment is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # The rules are what the page plays by; never publish them broken.
      - run: cargo test -p hibedi-core

      # The CLI must match the wasm-bindgen crate in Cargo.lock exactly.
      - id: wasm-bindgen
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

      - run: web/build.sh

      # The page and its build, without the local dev scripts.
      - run: |
          mkdir _site
          cp web/*.html web/*.css web/*.js web/*.wasm _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
