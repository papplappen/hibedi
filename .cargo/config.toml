# getrandom (via rand) picks its entropy source per target. On wasm the
# "custom" backend is used: the client defines __getrandom_v03_custom,
# which calls into the page (web/game.js: crypto.getRandomValues). This avoids pulling
# wasm-bindgen into the build, which the macroquad/gl.js loader cannot
# provide imports for.
[target.wasm32-unknown-unknown]
rustflags = [
    "--cfg",
    'getrandom_backend="custom"',
    "-C",
    "link-arg=--allow-undefined",
]
