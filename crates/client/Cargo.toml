[package]
name = "hibedi-client"
version.workspace = true
edition.workspace = true

[dependencies]
hibedi-core.workspace = true
hibedi-bots.workspace = true
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
# A 2D UI game: Bevy's rendering and UI, without the 3D, audio and
# gamepad stacks. Text uses the embedded fonts (assets/), so Bevy's
# default font is left out too, and taps are read without picking
# (src/ui/tap.rs).
bevy = { version = "0.19.1", default-features = false, features = [
    "default_app",
    "std",
    "multi_threaded",
    "bevy_winit",
    "ui_api",
    "ui_bevy_render",
    "mouse",
    "keyboard",
    "touch",
    "webgl2",
    "x11",
    "wayland",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.6.7", features = ["derive", "string"] }
dirs = "7.0.0"
hibedi-bots = { workspace = true, features = ["clap"] }
hibedi-core = { workspace = true, features = ["clap"] }
hibedi-relay-protocol.workspace = true
tungstenite = "0.30"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["web"] }
wasm-bindgen = "0.2"
# Entropy for `rand` from the browser (crypto.getRandomValues).
getrandom = { version = "0.4", features = ["wasm_js"] }
