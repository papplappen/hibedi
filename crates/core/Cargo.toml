[package]
name = "hibedi-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
rand.workspace = true

# `rand` routes its entropy through getrandom, which needs the browser's
# crypto.getRandomValues backend on wasm (see .cargo/config.toml for the
# matching `getrandom_backend` cfg).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
serde_json.workspace = true
