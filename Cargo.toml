[workspace]
resolver = "2"
members = ["crates/core", "crates/relay-protocol", "crates/client", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
hibedi-core = { path = "crates/core" }
hibedi-relay-protocol = { path = "crates/relay-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10"
